version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "API base URL is resolved at runtime from Amplify hostname (see lib/api-base-url.ts)."
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  customHeaders:
    - pattern: '/api/v1/**'
      headers:
        - key: 'Access-Control-Allow-Origin'
          value: '*'
