version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - mkdir -p .next/standalone/public/accounting && cp -r public/accounting/* .next/standalone/public/accounting/
        - mkdir -p .next/accounting && cp -r public/accounting/* .next/accounting/
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  customHeaders:
    - pattern: '/api/v1/**'
      headers:
        - key: 'Access-Control-Allow-Origin'
          value: '*'
